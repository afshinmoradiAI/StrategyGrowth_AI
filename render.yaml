# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: push to GitHub → Render dashboard → New → Blueprint → connect repo
# Render auto-reads this file and creates the service.
#
# ─── HOBBY (FREE) TIER NOTES ─────────────────────────────────────────────────
# Render renamed the Free tier to "Hobby" in their dashboard UI, but the
# blueprint value is still `plan: free`.
#
# • Hobby web services SLEEP after 15 minutes of inactivity — first request
#   after sleep takes ~30 seconds while the container spins back up.
# • Hobby tier provides 512 MB RAM and 0.1 CPU.
# • PERSISTENT DISKS ARE NOT AVAILABLE on Hobby — SQLite is stored on
#   ephemeral disk and WILL BE WIPED on every redeploy.
# • For production with persistence, upgrade to `plan: starter` ($7/mo)
#   and uncomment the `disk:` block at the bottom of this file.

services:
  - type: web
    name: strategygrowth-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free             # Render Hobby (free) — sleeps after 15 min idle, 512MB RAM
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      # -- Required (set manually in Render dashboard) --
      - key: ANTHROPIC_API_KEY
        sync: false

      # -- Auto-generated secure JWT signing key --
      - key: SECRET_KEY
        generateValue: true

      # -- Optional: leave blank if not using lead finder --
      - key: GOOGLE_PLACES_API_KEY
        sync: false

      # -- App settings (matches Free plan: Haiku only, 5 generations/month) --
      - key: LOG_LEVEL
        value: INFO
      - key: DEFAULT_MODEL
        value: claude-haiku-4-5
      - key: MAX_OUTPUT_TOKENS_PER_CALL
        value: "8192"
      - key: ENABLE_MESSAGE_CACHE
        value: "true"
      - key: RATE_LIMIT_DEFAULT
        value: 30/minute
      - key: RATE_LIMIT_ANONYMOUS
        value: 10/minute
      - key: AGENT_MAX_RETRIES
        value: "3"
      - key: PYTHONUNBUFFERED
        value: "1"
      # SQLite path — ephemeral on Free plan (resets on redeploy)
      - key: DB_PATH
        value: /app/data/plans.db

    # ─── Persistent disk (paid plans only) ────────────────────────────────────
    # Free plan does NOT support disks. Uncomment AFTER upgrading to `starter`:
    #
    # disk:
    #   name: strategygrowth-data
    #   mountPath: /app/data
    #   sizeGB: 1
