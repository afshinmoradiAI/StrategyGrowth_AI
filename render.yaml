# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: push to GitHub → Render dashboard → New → Blueprint → connect repo
# Render auto-reads this file and creates the service.

services:
  - type: web
    name: strategygrowth-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter          # free / starter / standard / pro
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      # -- Required (set manually in Render dashboard) --
      - key: ANTHROPIC_API_KEY
        sync: false

      # -- Auto-generated secure JWT signing key --
      - key: SECRET_KEY
        generateValue: true

      # -- Optional: leave blank if not using lead finder --
      - key: GOOGLE_PLACES_API_KEY
        sync: false

      # -- App settings --
      - key: LOG_LEVEL
        value: INFO
      - key: DEFAULT_MODEL
        value: claude-sonnet-4-5
      - key: MAX_OUTPUT_TOKENS_PER_CALL
        value: "8192"
      - key: ENABLE_MESSAGE_CACHE
        value: "true"
      - key: RATE_LIMIT_DEFAULT
        value: 30/minute
      - key: RATE_LIMIT_ANONYMOUS
        value: 10/minute
      - key: AGENT_MAX_RETRIES
        value: "3"
      - key: PYTHONUNBUFFERED
        value: "1"
      # SQLite path on the persistent disk
      - key: DB_PATH
        value: /app/data/plans.db

    # Persistent disk — SQLite survives redeploys
    disk:
      name: strategygrowth-data
      mountPath: /app/data
      sizeGB: 1
