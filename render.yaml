# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: push to GitHub → Render dashboard → New → Blueprint → connect repo
#
# ─── HOBBY (FREE) TIER NOTES ─────────────────────────────────────────────────
# Render renamed the Free tier to "Hobby" in their dashboard UI, but the
# blueprint value is still `plan: free`.
#
# • Hobby web services SLEEP after 15 min idle — first request after sleep
#   takes ~30 seconds while the container spins back up.
# • Hobby tier provides 512 MB RAM and 0.1 CPU.
# • Persistent disks are NOT available — SQLite resets on every redeploy.
# • For production with persistence, upgrade to `plan: starter` ($7/mo)
#   and uncomment the `disk:` block in the backend service.
#
# ─── AFTER FIRST DEPLOY ──────────────────────────────────────────────────────
# Both services will be created automatically. Then:
#   1. Backend gets URL like: https://strategygrowth-backend.onrender.com
#   2. Frontend gets URL like: https://strategygrowth-frontend.onrender.com
#   3. In Render dashboard → strategygrowth-frontend → Environment, set:
#        NEXT_PUBLIC_API_URL = https://strategygrowth-backend.onrender.com
#   4. In Render dashboard → strategygrowth-backend → Environment, set:
#        CORS_ORIGINS = https://strategygrowth-frontend.onrender.com
#   5. Both services auto-redeploy.

services:
  # ─── BACKEND (FastAPI) ─────────────────────────────────────────────────────
  - type: web
    name: strategygrowth-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      # -- Required: set in Render dashboard after first deploy --
      - key: ANTHROPIC_API_KEY
        sync: false           # Add your sk-ant-... key in the dashboard

      # -- Auto-generated secure JWT signing key (Render creates it) --
      - key: SECRET_KEY
        generateValue: true

      # -- Optional: only needed for Lead Finder (Google Places) --
      - key: GOOGLE_PLACES_API_KEY
        sync: false

      # -- CORS: set this after first deploy to your frontend URL --
      # Example: https://strategygrowth-frontend.onrender.com
      - key: CORS_ORIGINS
        sync: false

      # -- App settings (Free plan: Haiku only, 5 generations/month) --
      - key: LOG_LEVEL
        value: INFO
      - key: DEFAULT_MODEL
        value: claude-haiku-4-5
      - key: MAX_OUTPUT_TOKENS_PER_CALL
        value: "8192"
      - key: ENABLE_MESSAGE_CACHE
        value: "true"
      - key: RATE_LIMIT_DEFAULT
        value: 30/minute
      - key: RATE_LIMIT_ANONYMOUS
        value: 10/minute
      - key: AGENT_MAX_RETRIES
        value: "3"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DB_PATH
        value: /app/data/plans.db

    # ─── Persistent disk (paid plans only) ─────────────────────────────────
    # Uncomment after upgrading to `plan: starter` ($7/mo) for SQLite persistence:
    #
    # disk:
    #   name: strategygrowth-data
    #   mountPath: /app/data
    #   sizeGB: 1

  # ─── FRONTEND (Next.js) ────────────────────────────────────────────────────
  - type: web
    name: strategygrowth-frontend
    runtime: docker
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: true

    envVars:
      # Set this in Render dashboard to your backend URL after first deploy.
      # Example: https://strategygrowth-backend.onrender.com
      - key: NEXT_PUBLIC_API_URL
        sync: false
